<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle gradient border ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.7"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="256" r="150" fill="#0284c7" opacity="0.22" filter="url(#neonGlow)"/>

  <!-- Document / Shield icon container -->
  <g transform="translate(116, 96)">
    <!-- Shield / Bill Base -->
    <path d="M40 20 C40 10, 50 0, 62 0 L218 0 C230 0, 240 10, 240 20 L240 230 C240 280, 190 320, 140 338 C90 320, 40 280, 40 230 Z" 
          fill="url(#badgeGrad)" 
          opacity="0.95"/>
    
    <!-- Inner bill sheet fold accent -->
    <path d="M72 40 L208 40 C214 40, 220 46, 220 52 L220 180 C220 230, 180 270, 140 286 C100 270, 60 230, 60 180 L60 52 C60 46, 66 40, 72 40 Z" 
          fill="#090d16" 
          opacity="0.45"/>

    <!-- Bill lines -->
    <rect x="85" y="70" width="110" height="12" rx="6" fill="#e2e8f0" opacity="0.8"/>
    <rect x="85" y="96" width="75" height="10" rx="5" fill="#94a3b8" opacity="0.65"/>
    <rect x="85" y="118" width="95" height="10" rx="5" fill="#94a3b8" opacity="0.65"/>

    <!-- Dynamic Lightning Bolt Symbol (Energy & Fast Audit) -->
    <path d="M152 144 L102 216 L136 216 L124 286 L182 204 L148 204 Z" 
          fill="url(#boltGrad)" 
          filter="url(#neonGlow)"/>
  </g>

  <!-- Tiny sparkle top-right -->
  <path d="M390 100 L395 118 L413 123 L395 128 L390 146 L385 128 L367 123 L385 118 Z" fill="#38bdf8"/>
  <circle cx="106" cy="380" r="6" fill="#38bdf8" opacity="0.7"/>
</svg>